name: Response validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  response:
    name: ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - tier: archive
            label: Archived response data and planner algebra
          - tier: science
            label: Molecular response on CPU
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install the scientific CPU wheels
        if: matrix.tier == 'science'
        run: |
          python -m pip install --only-binary=:all: -r configs/response-science-requirements.txt
      - name: Run response checks
        run: python scripts/check_response_ci.py "${{ matrix.tier }}" --out "$RUNNER_TEMP/response"
      - name: Keep reports and command logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.tier }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/response/**/*.json
            ${{ runner.temp }}/response/**/*.jsonl
            ${{ runner.temp }}/response/**/*.log
            ${{ runner.temp }}/response/**/*.csv
          if-no-files-found: warn
